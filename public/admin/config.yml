# Use DecapBridge PKCE auth
backend:
    name: git-gateway
    repo: danko-miadria/astro-test-website
    branch: master
    auth_type: pkce
    base_url: https://auth.decapbridge.com
    auth_endpoint: /sites/b2eec2dd-cdd9-47c2-a1c3-27aed9605249/pkce
    auth_token_endpoint: /sites/b2eec2dd-cdd9-47c2-a1c3-27aed9605249/token
    gateway_url: https://gateway.decapbridge.com

    commit_messages:
        create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
        update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
        delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
        uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
        deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
        openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields
auth:
    email_claim: email
    first_name_claim: first_name
    last_name_claim: last_name
    avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://danko-miadria.github.io/astro-test-website

# REQUIRED: Image and Media upload settings
media_folder: "public/uploads"
public_folder: "/uploads"

# REQUIRED: Content collections configuration
collections:
    - name: "blog"
      label: "Blog Posts"
      folder: "src/content/blog"
      create: true
      slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
      fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Publish Date", name: "date", widget: "datetime" }
          - {
                label: "Description",
                name: "description",
                widget: "text",
                required: false,
            }
          - {
                label: "Featured Image",
                name: "thumbnail",
                widget: "image",
                required: false,
            }
          - { label: "Body", name: "body", widget: "markdown" }
